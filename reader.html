<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read & Split - Learn to Read!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #764ba2;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .instructions {
            background: #e8f4fd;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            color: #2c5282;
            font-size: 1.1em;
        }

        .sentence-container {
            background: #f0f4ff;
            border-radius: 20px;
            padding: 40px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            border: 3px dashed #667eea;
        }

        .sentence {
            font-size: 2.5em;
            color: #333;
            line-height: 1.6;
            word-spacing: 15px;
        }

        .word {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            user-select: none;
        }

        .word:hover {
            background: #ffd93d;
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .word.speaking {
            animation: pulse 0.8s ease-in-out;
            background: #ffd93d;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1.1); }
            50% { transform: scale(1.15); }
        }

        .word-parts {
            display: none;
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 0.6em;
            white-space: nowrap;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .word:hover .word-parts {
            display: block;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        .word-parts::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid #667eea;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .audio-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .audio-btn {
            background: #4CAF50;
            padding: 12px 25px;
            font-size: 1em;
        }

        .audio-btn.muted {
            background: #f44336;
        }

        .audio-btn:hover {
            background: #45a049;
        }

        .audio-btn.muted:hover {
            background: #da190b;
        }

        .progress {
            flex: 1;
            text-align: center;
            font-size: 1.1em;
            color: #667eea;
            font-weight: bold;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 10px;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            background: #667eea;
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        .emoji {
            font-size: 1.5em;
            margin-right: 10px;
        }

        .speech-status {
            font-size: 0.9em;
            color: #4CAF50;
            margin-top: 10px;
            height: 20px;
        }

        .speech-status.speaking {
            color: #ff9800;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .sentence { font-size: 1.8em; }
            .sentence-container { padding: 20px; }
            button { padding: 12px 20px; font-size: 1em; }
        }
    </style>
</head>

        // Fallback splitting function
        function splitWord(word) {
            if (wordSplits[word.toLowerCase()]) {
                return wordSplits[word.toLowerCase()];
            }
            word = word.toLowerCase();
            if (word.length <= 2) return word;
            const suffixes = ['ing', 'ed', 'er', 'est', 'ly', 'en', 'y', 's', 'es'];
            for (let suffix of suffixes) {
                if (word.endsWith(suffix) && word.length > suffix.length + 2) {
                    const base = word.slice(0, -suffix.length);
                    if (wordSplits[base]) {
                        return wordSplits[base] + '-' + suffix;
                    }
                    return base + '-' + suffix;
                }
            }
            if (word.endsWith('le') && word.length > 3) {
                const prev = word[word.length - 3];
                if ('bcdfghjklmnpqrstvwxyz'.includes(prev)) {
                    return word.slice(0, -3) + '-' + prev + 'le';
                }
            }
            const vowels = 'aeiouy';
            for (let i = 1; i < word.length - 1; i++) {
                if (vowels.includes(word[i]) && !vowels.includes(word[i+1])) {
                    return word.slice(0, i+1) + '-' + word.slice(i+1);
                }
            }
            return word;
        }

        let currentSentenceIndex = 0;
        let speechSynthesis = window.speechSynthesis;

        // Initialize the app
        function init() {
            renderSentence();
            updateAudioButton();
            if (!speechSupported) {
                document.getElementById('speechStatus').textContent = '🔇 Speech not supported in this browser';
                document.querySelectorAll('.audio-controls button').forEach(btn => btn.disabled = true);
            } else {
                // Set up speech voices when available
                speechSynthesis.onvoiceschanged = () => {
                    console.log('Speech voices loaded');
                };
            }
        }

        function renderSentence() {
            const sentenceDiv = document.getElementById('sentence');
            const sentence = sentences[currentSentenceIndex];
            const words = sentence.match(/\w+|[^\w\s]/g) || [];
            
            sentenceDiv.innerHTML = '';
            
            words.forEach(word => {
                if (/^\w+$/.test(word)) {
                    const wordSpan = document.createElement('span');
                    wordSpan.className = 'word';
                    wordSpan.textContent = word;
                    wordSpan.dataset.word = word;
                    
                    // Add click event for speech
                    wordSpan.addEventListener('click', () => speakWord(word));
                    
                    // Add hover for split view
                    const partsSpan = document.createElement('span');
                    partsSpan.className = 'word-parts';
                    partsSpan.textContent = splitWord(word);
                    wordSpan.appendChild(partsSpan);
                    
                    sentenceDiv.appendChild(wordSpan);
                } else {
                    const punctSpan = document.createElement('span');
                    punctSpan.textContent = word + ' ';
                    sentenceDiv.appendChild(punctSpan);
                }
                sentenceDiv.appendChild(document.createTextNode(' '));
            });
            
            updateControls();
        }

        function speakWord(word) {
            if (!audioEnabled || !speechSupported) return;
            
            // Cancel any current speech
            if (currentSpeech) {
                speechSynthesis.cancel();
            }
            
            // Update status
            const status = document.getElementById('speechStatus');
            status.textContent = '🔊 Speaking: ' + word;
            status.classList.add('speaking');
            
            // Add visual feedback
            const wordElement = document.querySelector(`[data-word="${word}"]`);
            if (wordElement) {
                wordElement.classList.add('speaking');
            }
            
            // Create speech utterance
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.rate = 0.8; // Slower for children
            utterance.pitch = 1.1; // Slightly higher pitch
            utterance.volume = 0.8;
            
            // Use child-friendly voice if available
            const voices = speechSynthesis.getVoices();
            const childVoice = voices.find(voice => 
                voice.name.includes('female') || 
                voice.name.includes('woman') ||
                voice.name.includes('girl')
            );
            if (childVoice) {
                utterance.voice = childVoice;
            }
            
            utterance.onend = () => {
                status.textContent = '';
                status.classList.remove('speaking');
                if (wordElement) {
                    wordElement.classList.remove('speaking');
                }
                currentSpeech = null;
            };
            
            utterance.onerror = () => {
                status.textContent = 'Speech error';
                status.classList.remove('speaking');
                if (wordElement) {
                    wordElement.classList.remove('speaking');
                }
                currentSpeech = null;
            };
            
            currentSpeech = utterance;
            speechSynthesis.speak(utterance);
        }

        function speakFullSentence() {
            if (!audioEnabled || !speechSupported) return;
            
            const sentence = sentences[currentSentenceIndex];
            const status = document.getElementById('speechStatus');
            
            if (currentSpeech) {
                speechSynthesis.cancel();
            }
            
            status.textContent = '🔊 Reading sentence...';
            status.classList.add('speaking');
            
            const utterance = new SpeechSynthesisUtterance(sentence);
            utterance.rate = 0.7;
            utterance.pitch = 1.1;
            utterance.volume = 0.8;
            
            const voices = speechSynthesis.getVoices();
            const childVoice = voices.find(voice => 
                voice.name.includes('female') || 
                voice.name.includes('woman') ||
                voice.name.includes('girl')
            );
            if (childVoice) {
                utterance.voice = childVoice;
            }
            
            utterance.onend = () => {
                status.textContent = '';
                status.classList.remove('speaking');
                currentSpeech = null;
            };
            
            currentSpeech = utterance;
            speechSynthesis.speak(utterance);
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            updateAudioButton();
            
            if (!audioEnabled && currentSpeech) {
                speechSynthesis.cancel();
                document.getElementById('speechStatus').textContent = '';
                document.getElementById('speechStatus').classList.remove('speaking');
                document.querySelectorAll('.word.speaking').forEach(w => w.classList.remove('speaking'));
            }
        }

        function updateAudioButton() {
            const btn = document.getElementById('audioToggle');
            if (audioEnabled) {
                btn.textContent = '🔊 Sound ON';
                btn.classList.remove('muted');
            } else {
                btn.textContent = '🔇 Sound OFF';
                btn.classList.add('muted');
            }
        }

        function updateControls() {
            document.getElementById('currentNum').textContent = currentSentenceIndex + 1;
            document.getElementById('progressFill').style.width = ((currentSentenceIndex + 1) / sentences.length * 100) + '%';
            
            document.getElementById('prevBtn').disabled = currentSentenceIndex === 0;
            document.getElementById('nextBtn').disabled = currentSentenceIndex === sentences.length - 1;
        }

        function nextSentence() {
            if (currentSentenceIndex < sentences.length - 1) {
                if (currentSpeech) speechSynthesis.cancel();
                currentSentenceIndex++;
                renderSentence();
            }
        }

        function previousSentence() {
            if (currentSentenceIndex > 0) {
                if (currentSpeech) speechSynthesis.cancel();
                currentSentenceIndex--;
                renderSentence();
            }
        }

        // Keyboard navigation and shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSentence();
            if (e.key === 'ArrowLeft') previousSentence();
            if (e.key === ' ' && audioEnabled) {
                e.preventDefault();
                speakFullSentence();
            }
        });

        init();
